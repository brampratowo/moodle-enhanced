# Kredensial root MinIO dari .env (MINIO_ROOT_USER, MINIO_ROOT_PASSWORD).
services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z-cpuv1
    container_name: moodle-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - 9000:9000 # Api
      - 9001:9001 # WebUI
    volumes:
      - ./data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - docker_network

networks:
  docker_network:
    external: true